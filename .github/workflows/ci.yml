name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Make gradlew executable
        run: chmod +x gradlew
      # Lint 有任何 error 即失败（发布硬门禁）
      # release 使用 debug 回退签名保证本地可复现；接入正式签名时在仓库 Secrets 注入 keystore.properties
      - name: Verify
        run: ./gradlew lintDebug testDebugUnitTest assembleDebug bundleRelease
